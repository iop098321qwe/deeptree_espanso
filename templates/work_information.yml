# Espanso Match File

# Technician-specific work information.
# Copy this file into your Espanso match directory and update the values.
global_vars:
  - name: myfirst
    label: First Name Variable
    comment: "Input your first name in the 'echo' field."
    type: echo
    params:
      echo: "First"

  - name: mymiddle
    label: Middle Name Variable
    comment: "Input your middle name in the 'echo' field."
    type: echo
    params:
      echo: "Middle"

  - name: mylast
    label: Last Name Variable
    comment: "Input your last name in the 'echo' field."
    type: echo
    params:
      echo: "Last"

  - name: myname
    label: Full Name Variable
    comment: "Input your full name in the 'echo' field."
    type: echo
    params:
      echo: "{{myfirst}} {{mylast}}"

  - name: mylegalname
    label: Full Legal Name Variable
    comment: "Input your full legal name in the 'echo' field."
    type: echo
    params:
      echo: "{{myfirst}} {{mymiddle}} {{mylast}}"

  - name: myemail
    label: Personal Email Variable
    comment: "Input your personal email in the 'echo' field."
    type: echo
    params:
      echo: "personal@example.com"

  - name: workemail
    label: Work Email Variable
    type: echo
    params:
      echo: "first.last@deeptree.tech"

  - name: title
    label: Work Title Variable
    type: echo
    params:
      echo: "Technician"
