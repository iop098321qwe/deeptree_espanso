# Espanso Match File

# Print the current date
matches:
  # Get the date for next Monday
  - trigger: ";mon"
    name: "Next Monday with date"
    label: Next Monday with Date
    comment: "Outputs the next Monday and its date."
    replace: "{{output}} $|$"
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            date -d "next Monday" '+Monday %Y-%m-%d'

  # Get the date for next Tuesday
  - trigger: ";tues"
