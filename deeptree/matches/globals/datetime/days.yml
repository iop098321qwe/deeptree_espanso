  # Get the date for next Sunday
  - trigger: ";sun"
    name: "Next Sunday with date"
    label: Next Sunday with Date
    comment: "Outputs the next Sunday and its date."
    replace: "{{output}} $|$"
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            date -d "next Sunday" '+Sunday %Y-%m-%d'

  # Get the date for last Monday
  - trigger: ";lstmon"
    name: "Previous Monday with date"
    label: Previous Monday with Date
    comment: "Outputs the previous Monday and its date."
    replace: "{{output}} $|$"
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            date -d "last Monday" '+last Monday, %Y-%m-%d'

  # Get date for last Monday minus N weeks
  - regex: ";(?P<weeks>[0-9]+)\\.lstmon"
    name: "Previous Monday minus N weeks"
    label: Previous Monday minus N Weeks
    comment: "Outputs the date N weeks before the previous Monday."
    replace: "{{output}} $|$"
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            date -d "last Monday - {{weeks}} weeks" '+Monday %Y-%m-%d'

  # Get the date for last Tuesday
