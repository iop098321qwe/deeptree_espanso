    name: "Next Sunday plus N weeks"
    label: Next Sunday plus N Weeks
    comment: "Outputs the date N weeks after the next Sunday."
    replace: "{{output}} $|$"
    vars:
      - name: output
        type: shell
        params:
          cmd: |
            date -d "next Sunday + {{weeks}} weeks" '+Sunday %Y-%m-%d'

  # Numeric form input is validated before interpolation into date commands.
  # Get the date for last Monday minus N weeks using a form
  - trigger: ":lstmon"
    name: Previous Monday minus N Weeks Form
    comment: "Asks for weeks to subtract from the previous Monday's date."
    label: Previous Monday minus N weeks (Form)
    replace: "{{output}} $|$"
    vars:
      - &weeks_form
        name: input
        type: form
        params:
          layout: "Weeks (non-negative whole number): [[count]]"
          fields:
            count:
              default: "1"
      - &weeks_count
        name: count
        type: echo
        params:
          echo: "{{input.count}}"
      - &validated_weeks
        name: weeks
        type: shell
        depends_on: [count]
        params:
          cmd: |-
            case "$ESPANSO_COUNT" in
              ""|*[!0-9]*) exit 1 ;;
              *) printf '%s' "$ESPANSO_COUNT" ;;
            esac
      - name: output
        type: shell
        params:
          cmd: "date -d 'last Monday - {{weeks}} weeks' '+Monday %Y-%m-%d'"

  # Get the date for last Tuesday minus N weeks using a form
  - trigger: ":lsttues"
    name: Previous Tuesday minus N Weeks Form
    comment: "Asks for weeks to subtract from the previous Tuesday's date."
    label: Previous Tuesday minus N weeks (Form)
    replace: "{{output}} $|$"
    vars:
      - *weeks_form
      - *weeks_count
      - *validated_weeks
      - name: output
        type: shell
        params:
          cmd: "date -d 'last Tuesday - {{weeks}} weeks' '+Tuesday %Y-%m-%d'"

