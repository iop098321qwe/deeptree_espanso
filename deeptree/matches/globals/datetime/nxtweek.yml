# Espanso Match File

# nxtweek Matches

matches:
  # Get the same weekday from next week in ISO 8601 format
  - trigger: ";nxtweek"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: shell
        params:
          cmd: "date -d 'next week' '+%A %Y-%m-%d'"

  # Get the same weekday from N weeks ahead in ISO 8601 format
  - regex: ";(?P<weeks>[0-9]+)\\.nxtweek"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: shell
        params:
          cmd: "date -d '+{{weeks}} weeks' '+%A %Y-%m-%d'"

  - trigger: ":nxtweek"
    label: N weeks ahead (Form)
    replace: "{{mydate}}"
    vars:
      - name: input
        type: form
        params:
          layout: "Weeks (non-negative whole number): [[count]]"
          fields:
            count:
              default: "1"
      - name: count
        type: echo
        params:
          echo: "{{input.count}}"
      - name: weeks
        type: shell
        depends_on: [count]
        params:
          cmd: |-
            case "$ESPANSO_COUNT" in
              ""|*[!0-9]*) exit 1 ;;
              *) printf '%s' "$ESPANSO_COUNT" ;;
            esac
      - name: mydate
        type: shell
        params:
          cmd: "date -d '+{{weeks}} weeks' '+%A %Y-%m-%d'"
