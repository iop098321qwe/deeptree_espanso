# Espanso Match File

# nxtweek Matches

matches:
  # Get the same weekday from next week in ISO 8601 format
  - trigger: ";nxtweek"
    name: Same Weekday Next Week
    label: Same Weekday Next Week
    comment: "Outputs the weekday and date one week from now."
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: shell
        params:
          cmd: "date -d 'next week' '+%A %Y-%m-%d'"

  # Get the same weekday from N weeks ahead in ISO 8601 format
  - regex: ";(?P<weeks>[0-9]+)\\.nxtweek"
    name: Same Weekday N Weeks Ahead
    label: Same Weekday N Weeks Ahead
    comment: "Outputs the weekday and date N weeks from now."
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: shell
        params:
          cmd: "date -d '+{{weeks}} weeks' '+%A %Y-%m-%d'"

  # Get the same weekday N weeks ahead using a form
  - trigger: ":nxtweek"
    name: Same Weekday N Weeks Ahead Form
    comment: "Asks for a week count and outputs that future weekday and date."
    label: N weeks ahead (Form)
    replace: "{{mydate}}"
    vars:
      - name: input
        type: form
        params:
          layout: "Weeks (non-negative whole number): [[count]]"
          fields:
            count:
              default: "1"
      - name: count
        type: echo
        params:
          echo: "{{input.count}}"
      - name: weeks
        type: shell
        depends_on: [count]
        params:
          cmd: |-
            case "$ESPANSO_COUNT" in
              ""|*[!0-9]*) exit 1 ;;
              *) printf '%s' "$ESPANSO_COUNT" ;;
            esac
      - name: mydate
        type: shell
        params:
          cmd: "date -d '+{{weeks}} weeks' '+%A %Y-%m-%d'"
