# Espanso Match File

# Print the time
matches:
  # Print the current time
  - trigger: ;time
    name: Current Time
    label: Current Time
    comment: "Outputs the current time in 24-hour format."
    replace: "{{mytime}}"
    vars:
      - name: mytime
        type: date
        params:
          format: "%H:%M"

  # Print the current date in ISO 8601 format
  - trigger: ";date"
    name: Current Date
    label: Current Date
    comment: "Outputs today's date as YYYY-MM-DD."
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  # Print the disabled date in ISO 8601 format
  - trigger: ";disdate"
    name: Disabled Date
    label: Disabled Date
    comment: "Outputs Disabled followed by today's date."
    replace: "Disabled {{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  # Write a timestamp
  - trigger: ;stamp
    name: Time Stamp
    label: Time Stamp
    comment: "Outputs the current time in parentheses."
    replace: "{{timestamp}}"
    vars:
      - name: timestamp
        type: date
        params:
          format: "(%H:%M)"

  # Write a full timestamp
  - trigger: ;fullstamp
    name: Full Time Stamp
    label: Full Time Stamp
    comment: "Outputs the current date and time in parentheses."
    replace: "{{timestamp}}"
    vars:
      - name: timestamp
        type: date
        params:
          format: "(%Y-%m-%d %H:%M)"

  # Write a full timestamp with day, date and time
  - trigger: ;daystamp
    name: Day Date and Time Stamp
    label: Day Date and Time Stamp
    comment: "Outputs the current weekday, date, and time."
    replace: "{{timestamp}}"
    vars:
      - name: timestamp
        type: date
        params:
          format: "%A %Y-%m-%d %H:%M"

  # Create a match for daily notes
  - trigger: ";daily"
    name: Daily Note Filename
    label: Daily Note Filename
    comment: "Outputs today's date with the fixed -dallas.md suffix."
    replace: "{{daily}}"
    vars:
      - name: daily
        type: date
        params:
          format: "%Y-%m-%d-dallas.md"

  # Print the current day of the week
  - trigger: ";day"
    name: Current Weekday
    label: Current Weekday
    comment: "Outputs the current weekday name."
    replace: "{{current_day}}"
    propagate_case: true
    vars:
      - name: current_day
        type: date
        params:
          format: "%A"

  # Print the day and date for today
  - triggers: [";daydate", ";today"]
    name: Today with Weekday and Date
    label: Today with Weekday and Date
    comment: "Outputs today with the weekday and date."
    replace: "{{current_day}}"
    propagate_case: true
    vars:
      - name: current_day
        type: date
        params:
          format: "today, %A %Y-%m-%d"

  # Print the day and date for tomorrow
  - trigger: ";tomorrow"
    name: Tomorrow with Weekday and Date
    label: Tomorrow with Weekday and Date
    comment: "Outputs tomorrow with the weekday and date."
    replace: "{{tomorrow}}"
    propagate_case: true
    vars:
      - name: tomorrow
        type: date
        params:
          format: "tomorrow, %A %Y-%m-%d"
          offset: 86400

  # Print the day and date for yesterday
  - trigger: ";yesterday"
    name: Yesterday with Weekday and Date
    label: Yesterday with Weekday and Date
    comment: "Outputs yesterday with the weekday and date."
    replace: "{{yesterday}}"
    propagate_case: true
    vars:
      - name: yesterday
        type: date
        params:
          format: "yesterday, %A %Y-%m-%d"
          offset: -86400
