# ==============================================================================
# CREDENTIAL MATCHES
#
# Each client uses one client_config value:
#   username_format|email_domain|optional_email_local_format
#
# Examples:
#   fnln|client.org|          = johnsmith / johnsmith@client.org
#   fnli|client.org|fn.ln     = johns / john.smith@client.org
#
# Leave the third field blank to use the username format for the email address.
# This is the standard use, but optionally allows the email username to be
# overwritten.
#
# Format shortcuts:
#   fn    = firstname only                    (john)
#   ln    = lastname only                     (smith)
#   fnln  = firstname + lastname              (johnsmith)
#   fnli  = firstname + last initial          (johns)
#   filn  = first initial + lastname          (jsmith)
#   fili  = first initial + last initial      (js)
#   fn.ln = firstname + "." + lastname        (john.smith)
#   fn.li = firstname + "." + last initial    (john.s)
#   fi.ln = first initial + "." + lastname    (j.smith)
#   fi.li = first initial + "." + last initial (j.s)
#
# To add a client, copy both its regex and form entries and change:
#   1. Client name and purpose comments
#   2. Regex and form triggers, names, labels, and comment fields
#   3. client_config value in both entries
# ==============================================================================

anchors:
  credential_output: &credential_output
    name: credentials
    type: script
    params:
      args:
        - bash
        - "%PACKAGES%/deeptree/scripts/credential-generator.sh"

  temporary_password: &temporary_password
    name: temppass
    type: match
    params:
      trigger: ";tp"

matches:
  # Paste the temporary password used by the credential expansions below.
  - trigger: ";tp"
    name: Temporary Password from Clipboard
    label: Temporary Password from Clipboard
    comment: "Inserts Password followed by the copied temporary password."
    vars:
      - name: "clipb"
        type: "clipboard"
    replace: |-
      Password: {{clipb}}
      $|$

  # ==============================================================================
  # Alaska Family Services
  # ==============================================================================
  # Set up replacement for Alaska Family Services credentials
  - regex: ';credafs(?P<firstname>[^,]+),(?P<lastname>[^.]+)\.' # EDIT THIS LINE
    name: Alaska Family Services Credentials
    label: Alaska Family Services Credentials
    comment: "Formats client credentials with the copied temporary password."
    vars:
      - name: client_config
        type: echo
        params: { echo: "fnli|akafs.org|" } # EDIT THIS LINE
      - *credential_output
      - *temporary_password
    replace: "{{credentials}}\n{{temppass}}"

