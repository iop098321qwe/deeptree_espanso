# ==============================================================================
# CREDENTIAL MATCHES
#
# Each client uses one client_config value:
#   username_format|email_domain|optional_email_local_format
#
# Examples:
#   fnln|client.org|          = johnsmith / johnsmith@client.org
#   fnli|client.org|fn.ln     = johns / john.smith@client.org
#
# Leave the third field blank to use the username format for the email address.
# This is the standard use, but optionally allows the email username to be
# overwritten.
#
# Format shortcuts:
#   fn    = firstname only                    (john)
#   ln    = lastname only                     (smith)
#   fnln  = firstname + lastname              (johnsmith)
#   fnli  = firstname + last initial          (johns)
#   filn  = first initial + lastname          (jsmith)
#   fili  = first initial + last initial      (js)
#   fn.ln = firstname + "." + lastname        (john.smith)
#   fn.li = firstname + "." + last initial    (john.s)
#   fi.ln = first initial + "." + lastname    (j.smith)
#   fi.li = first initial + "." + last initial (j.s)
#
# To add a client, copy an entry below and change only:
#   1. Client name comment
#   2. regex trigger line
#   3. client_config value
# ==============================================================================

anchors:
  credential_output: &credential_output
    name: credentials
    type: script
    params:
      args:
        - bash
        - "%CONFIG%/match/packages/deeptree/scripts/credential-generator.sh"

  temporary_password: &temporary_password
    name: temppass
    type: match
    params:
      trigger: ";tp"

matches:
