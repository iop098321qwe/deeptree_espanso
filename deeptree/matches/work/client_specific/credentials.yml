  # Form input is mapped to the variables expected by the shared script.
  - trigger: ":credafs"
    label: Alaska Family Services Credentials (Form)
    replace: "{{credentials}}\n{{temppass}}"
    vars:
      - &credential_form
        name: input
        type: form
        params:
          layout: |-
            First name: [[firstname]]
            Last name: [[lastname]]
      - &form_firstname
        name: firstname
        type: echo
        params:
          echo: "{{input.firstname}}"
      - &form_lastname
        name: lastname
        type: echo
        params:
          echo: "{{input.lastname}}"
      - name: client_config
        type: echo
        params: { echo: "fnli|akafs.org|" }
      - &form_credentials
        name: credentials
        type: script
        depends_on: [firstname, lastname, client_config]
        params:
          args:
            - bash
            - "%CONFIG%/match/packages/deeptree/scripts/credential-generator.sh"
      - *temporary_password

