# espanso match file

# email
matches:
  # Set up replacement for normal Deeptree email
  - regex: ";emailnorm(?P<person>.*)\\."
    name: Dynamic Deeptree Email
    comment: "Creates a general email with a greeting and signature."
    label: Dynamic Deeptree Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      $|$

      You may respond to this email directly, or call {{dthelp}} with any additional information, questions, or concerns that you may have.

      {{signature}}

  # Set up replacement for response-requested email
  - regex: ";emailreq(?P<person>.*)\\."
    name: Dynamic Request For Action Email
    comment: "Creates an email asking the recipient to respond."
    label: Dynamic Request For Action Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      $|$

      {{reqresponse}}

      {{signature}}

  # Set up replacement for disk space cleanup email
  - regex: ";emaildisk(?P<person>.*)\\."
    name: Dynamic Disk Space Email
    comment: "Creates an email asking the recipient to free disk space."
    label: Dynamic Request For Disk Space Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      We have an automatic alert that was generated for your computer$|$. This alert is a notification that the storage has exceed 95% capacity on your computer.

      At the time of this email, you ({{person}}) were the last known user to login to the computer.

      Due to this alert, we would like to coordinate an appointment (typically 60-90 minutes) to perform cleanup on the computer when it is not in use. We do not need to work directly with you to perform the cleanup, however we will need to ensure that we are connecting at a time that the computer will not be needed for the duration of the appointment.

      Please provide multiple dates and specific times that would work for this appointment, we would love to get it onto our calendar so that we can perform this cleanup operation.

      {{reqresponse}}

      {{signature}}

  # Set up replacement for follow-up email
  - regex: ";emailfu(?P<person>.*)\\."
    name: Dynamic Follow-Up Email
    comment: "Creates a follow-up email asking for a response."
    label: Dynamic Follow-Up Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{followup}}

      $|$

      {{reqresponse}}

      {{signature}}

  # Set up replacement for done-yet follow-up email
  - regex: ";emaildy(?P<person>.*)\\."
    name: Dynamic Done Yet Email
    comment: "Creates an email asking whether assistance is still needed."
    label: Dynamic Done Yet Follow-Up Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{noresponse}}
      $|$
      {{assornoass}}

      {{signature}}

  # Set up replacement for voicemail follow-up email
  - regex: ";emailvm(?P<person>.*)\\."
    name: Dynamic Voicemail Email
    comment: "Creates a follow-up email after leaving a voicemail."
    label: Dynamic Voicemail Follow-Up Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{voicemail}}

      $|$

      {{reqresponse}}

      {{signature}}

  # Set up replacement for follow-up email when no voicemail was left
  - regex: ";emailnovm(?P<person>.*)\\."
    name: Dynamic No Voicemail Email
    comment: "Creates a follow-up email when a voicemail could not be left."
    label: Dynamic Unable to Leave a Voicemail Follow-Up Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{novoicemail}}

      $|$

      {{novmfollowup}}

      {{reqresponse}}

      {{signature}}

  # Set up replacement for missed appointment email with voicemail
  - regex: ";emailmissvm(?P<person>.*)\\."
    name: Dynamic Missed Appointment Voicemail Email
    comment: "Creates a missed-appointment email after leaving a message."
    label: Dynamic Missed Appointment w/ Voicemail or Message Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{voicemail}}

      {{missappvm}}

      {{reqresponse}}

      {{signature}}

  # Set up replacement for missed appointment email without voicemail
  - regex: ";emailmissnovm(?P<person>.*)\\."
    name: Dynamic Missed Appointment No Voicemail Email
    comment: "Creates a missed-appointment email when no voicemail was left."
    label: Dynamic Missed Appointment Email
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{novoicemail}}$|$

      {{missappnovm}}

      {{reqresponse}}

      {{signature}}

  # Set up replacement for notification email
  - regex: ";emailnoti(?P<person>.*)\\."
    name: Dynamic Notification Email
    label: Dynamic Notification Email
    comment: "This is a dynamically generated email to send notifications. It is useful for sending emails that do not require a response."
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **NO RESPONSE REQUIRED**

      $|$

      {{notification}}

      {{signature}}

  # Set up replacement for completion notification email
  - regex: ";emailcomp(?P<person>.*)\\."
    name: Dynamic Completion Email
    label: Dynamic Completion Email
    comment: "This is a dynamically generated email to send completion notifications. It is useful for notifying the completion of work."
    force_mode: clipboard
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      **NO RESPONSE REQUIRED**

      {{completedwork}}

      {{checkup}}
      $|$
      This is a notification of completion email. To reopen your ticket if anything does not meet satisfactory completion standards, please respond to this email directly, or call {{dthelp}} with any additional information, questions, or concerns that you may have.

      {{signature}}

  # Optional form versions of the dynamic email templates.
  # Set up replacement for normal Deeptree email using a form
  - trigger: ":emailnorm"
    name: Deeptree Email Form
    comment: "Asks for a recipient and message to create a general email."
    label: Deeptree Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      {{input.message}}$|$

      You may respond to this email directly, or call {{dthelp}} with any additional information, questions, or concerns that you may have.

      {{signature}}
    vars: &email_form
      - name: input
        type: form
        params:
          layout: |-
            Recipient: [[person]]
            Message (optional):
            [[message]]
          fields:
            message:
              multiline: true

  # Set up replacement for response-requested email using a form
  - trigger: ":emailreq"
    name: Request For Action Email Form
    comment: "Asks for a recipient and message to create a response request."
    label: Request For Action Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{input.message}}$|$

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for disk space cleanup email using a form
  - trigger: ":emaildisk"
    name: Disk Space Email Form
    comment: "Asks for email details to create a disk space cleanup request."
    label: Request For Disk Space Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      We have an automatic alert that was generated for your computer{{input.computer}}. This alert is a notification that the storage has exceed 95% capacity on your computer.

      At the time of this email, you ({{input.person}}) were the last known user to login to the computer.

      Due to this alert, we would like to coordinate an appointment (typically 60-90 minutes) to perform cleanup on the computer when it is not in use. We do not need to work directly with you to perform the cleanup, however we will need to ensure that we are connecting at a time that the computer will not be needed for the duration of the appointment.

      Please provide multiple dates and specific times that would work for this appointment, we would love to get it onto our calendar so that we can perform this cleanup operation.

      {{input.message}}$|$

      {{reqresponse}}

      {{signature}}
    vars:
      - name: input
        type: form
        params:
          layout: |-
            Recipient: [[person]]
            Computer suffix (optional, include leading space): [[computer]]
            Message (optional):
            [[message]]
          fields:
            message:
              multiline: true

  # Set up replacement for follow-up email using a form
  - trigger: ":emailfu"
    name: Follow-Up Email Form
    comment: "Asks for a recipient and message to create a follow-up email."
    label: Follow-Up Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{followup}}

      {{input.message}}$|$

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for done-yet follow-up email using a form
  - trigger: ":emaildy"
    name: Done Yet Email Form
    comment: "Asks for details to check whether assistance is still needed."
    label: Done Yet Follow-Up Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{noresponse}}
      {{input.message}}$|$
      {{assornoass}}

      {{signature}}
    vars: *email_form

  # Set up replacement for voicemail follow-up email using a form
  - trigger: ":emailvm"
    name: Voicemail Email Form
    comment: "Asks for email details to follow up after leaving a voicemail."
    label: Voicemail Follow-Up Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{voicemail}}

      {{input.message}}$|$

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for follow-up email without voicemail using a form
  - trigger: ":emailnovm"
    name: No Voicemail Email Form
    comment: "Asks for email details to follow up when no voicemail was left."
    label: Unable to Leave a Voicemail Follow-Up Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{novoicemail}}

      {{input.message}}$|$

      {{novmfollowup}}

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for missed appointment email with voicemail using a form
  - trigger: ":emailmissvm"
    name: Missed Appointment Voicemail Email Form
    comment: "Asks for email details after a missed appointment and message."
    label: Missed Appointment with Voicemail Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{voicemail}}

      {{missappvm}}

      {{input.message}}$|$

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for missed appointment email with no voicemail via form
  - trigger: ":emailmissnovm"
    name: Missed Appointment No Voicemail Email Form
    comment: "Asks for details after a missed appointment with no message."
    label: Missed Appointment Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **RESPONSE REQUESTED**

      {{novoicemail}}

      {{input.message}}$|$

      {{missappnovm}}

      {{reqresponse}}

      {{signature}}
    vars: *email_form

  # Set up replacement for notification email using a form
  - trigger: ":emailnoti"
    name: Notification Email Form
    comment: "Asks for details to send a no-response-required notification."
    label: Notification Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **NO RESPONSE REQUIRED**

      {{input.message}}$|$

      {{notification}}

      {{signature}}
    vars: *email_form

  # Set up replacement for completion notification email using a form
  - trigger: ":emailcomp"
    name: Completion Email Form
    comment: "Asks for email details to send a work completion notification."
    label: Completion Email (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      **NO RESPONSE REQUIRED**

      {{completedwork}}

      {{checkup}}
      {{input.message}}$|$
      This is a notification of completion email. To reopen your ticket if anything does not meet satisfactory completion standards, please respond to this email directly, or call {{dthelp}} with any additional information, questions, or concerns that you may have.

      {{signature}}
    vars: *email_form
