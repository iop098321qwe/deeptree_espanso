# Espanso Match File

# Dispatch Email Template Matches
matches:
  # Set up replacement for first response request with appointment
  - regex: ";resreqapp(?P<person>.*)\\."
    name: Request with Appointment Response
    label: Request with Appointment Email Response Template
    comment: "This is an email response template for a request with an appointment."
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{setappointment}}

      {{deadlines}}

      {{signature}}

  # Set up replacement for first response request without appointment
  - regex: ";resreqnoapp(?P<person>.*)\\."
    name: Request without Appointment Response
    label: Request without Appointment Email Response Template
    comment: "This is an email response template for a request without an appointment."
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{deadlines}}

      {{signature}}

  # Set up replacement for first response incident
  - regex: ";resinc(?P<person>.*)\\."
    name: Incident Response
    label: Incident Email Response Template
    comment: "This is an email response template for an incident."
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{setappointment}}

      {{signature}}

  # Set up replacement for first response spam
  - regex: ";resspam(?P<person>.*)\\."
    name: Spam Response
    label: Spam Email Response Template
    comment: "This is an email response template for spam."
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}

      {{assigned}}

      They will notify you if this is indeed spam and block the sender. If it is safe, they will reach out to confirm it is all right to access the email and its contents. Please let me know if you have any questions or concerns, and I will do my best to address them!

      {{signature}}

  # Set up replacement for first response request with appointment using a form
  - trigger: ":resreqapp"
    name: Request with Appointment Response Form
    comment: "Asks for details to respond to a request with an appointment."
    label: Request with Appointment Response (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      {{outreachthanks}}
      {{input.message}}$|$
      {{assigned}}

      {{setappointment}}

      {{deadlines}}

      {{signature}}
    vars: &response_form
      - name: input
        type: form
        params:
          layout: |-
            Recipient: [[person]]
            Message (optional):
            [[message]]
          fields:
            message:
              multiline: true

  # Set up replacement for request response without appointment using a form
  - trigger: ":resreqnoapp"
    name: Request without Appointment Response Form
    comment: "Asks for details to respond to a request without scheduling."
    label: Request without Appointment Response (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      {{outreachthanks}}
      {{input.message}}$|$
      {{assigned}}

      {{deadlines}}

      {{signature}}
    vars: *response_form

  # Set up replacement for first response incident using a form
  - trigger: ":resinc"
    name: Incident Response Form
    comment: "Asks for email details to respond to an incident with scheduling."
    label: Incident Response (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      {{outreachthanks}}
      {{input.message}}$|$
      {{assigned}}

      {{setappointment}}

      {{signature}}
    vars: *response_form

  # Set up replacement for first response spam using a form
  - trigger: ":resspam"
    name: Spam Response Form
    comment: "Asks for email details to respond to a spam ticket."
    label: Spam Response (Form)
    force_mode: clipboard
    replace: |-
      {{greeting}}{{input.person}},{{addongreeting}}

      {{outreachthanks}}

      {{assigned}}

      They will notify you if this is indeed spam and block the sender. If it is safe, they will reach out to confirm it is all right to access the email and its contents. Please let me know if you have any questions or concerns, and I will do my best to address them!

      {{input.message}}$|$

      {{signature}}
    vars: *response_form
